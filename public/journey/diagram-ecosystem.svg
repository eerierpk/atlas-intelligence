<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Layered diagram of imaging ecosystem">
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0ea5b7"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <rect width="800" height="360" fill="#0b1220"/>
  <g font-size="11" fill="#cbd5e1">
    <text x="20" y="24" font-size="12" font-weight="700" fill="#e2e8f0">Imaging ecosystem ΓÇö layered view</text>
    <g>
      <rect x="20" y="50" width="170" height="260" rx="10" fill="#0f172a" stroke="#1f2a44"/>
      <text x="105" y="72" text-anchor="middle" fill="#7dd3fc" font-weight="700">Modality</text>
      <text x="105" y="100" text-anchor="middle">Scanner / detector</text>
      <text x="105" y="120" text-anchor="middle">Console PC</text>
      <text x="105" y="140" text-anchor="middle">Coils / probes</text>
      <text x="105" y="160" text-anchor="middle">Injector / generator</text>
      <text x="105" y="180" text-anchor="middle">UPS / cooling</text>
    </g>
    <g>
      <rect x="210" y="50" width="170" height="260" rx="10" fill="#0f172a" stroke="#1f2a44"/>
      <text x="295" y="72" text-anchor="middle" fill="#7dd3fc" font-weight="700">Workstation</text>
      <text x="295" y="100" text-anchor="middle">Diagnostic viewer</text>
      <text x="295" y="120" text-anchor="middle">3D / advanced apps</text>
      <text x="295" y="140" text-anchor="middle">Dose mgmt</text>
      <text x="295" y="160" text-anchor="middle">Reporting client</text>
    </g>
    <g>
      <rect x="400" y="50" width="170" height="260" rx="10" fill="#0f172a" stroke="#1f2a44"/>
      <text x="485" y="72" text-anchor="middle" fill="#7dd3fc" font-weight="700">Network</text>
      <text x="485" y="100" text-anchor="middle">Modality VLAN</text>
      <text x="485" y="120" text-anchor="middle">DICOM / DICOMweb</text>
      <text x="485" y="140" text-anchor="middle">HL7 v2 / FHIR</text>
      <text x="485" y="160" text-anchor="middle">MWL / MPPS</text>
      <text x="485" y="180" text-anchor="middle">TLS, identity, audit</text>
    </g>
    <g>
      <rect x="590" y="50" width="190" height="260" rx="10" fill="#0f172a" stroke="#1f2a44"/>
      <text x="685" y="72" text-anchor="middle" fill="#7dd3fc" font-weight="700">Archive / Cloud</text>
      <text x="685" y="100" text-anchor="middle">PACS</text>
      <text x="685" y="120" text-anchor="middle">VNA</text>
      <text x="685" y="140" text-anchor="middle">RIS / EHR</text>
      <text x="685" y="160" text-anchor="middle">Backup / DR</text>
      <text x="685" y="180" text-anchor="middle">AI orchestration</text>
    </g>
    <g stroke="url(#g)" stroke-width="2" fill="none" marker-end="url(#arr)">
      <line x1="190" y1="220" x2="210" y2="220"/>
      <line x1="380" y1="220" x2="400" y2="220"/>
      <line x1="570" y1="220" x2="590" y2="220"/>
    </g>
    <text x="20" y="340" font-size="10" fill="#64748b">MedIntel Atlas ΓÇö educational diagram. Conceptual; specifics vary by institution and OEM.</text>
  </g>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/>
    </marker>
  </defs>
</svg>
