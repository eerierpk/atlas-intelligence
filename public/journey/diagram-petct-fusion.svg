<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" font-family="ui-sans-serif, system-ui, sans-serif" role="img" aria-label="PET CT fusion concept">
  <rect width="600" height="320" fill="#0b1220"/>
  <g fill="#cbd5e1" font-size="12">
    <text x="20" y="32" font-size="13" font-weight="700" fill="#e2e8f0">PET / CT fusion (concept)</text>
    <g transform="translate(40,70)">
      <rect width="160" height="160" rx="14" fill="#0f223e" stroke="#1f2a44"/>
      <text x="80" y="28" text-anchor="middle" font-weight="700" fill="#7dd3fc">CT</text>
      <text x="80" y="48" text-anchor="middle" font-size="11">anatomy</text>
      <ellipse cx="80" cy="105" rx="55" ry="38" fill="none" stroke="#94a3b8" stroke-width="1.2"/>
      <ellipse cx="80" cy="105" rx="35" ry="22" fill="none" stroke="#94a3b8" stroke-width="1.2"/>
    </g>
    <text x="220" y="160" font-size="22" fill="#94a3b8">+</text>
    <g transform="translate(250,70)">
      <rect width="160" height="160" rx="14" fill="#0f223e" stroke="#1f2a44"/>
      <text x="80" y="28" text-anchor="middle" font-weight="700" fill="#fde68a">PET</text>
      <text x="80" y="48" text-anchor="middle" font-size="11">function</text>
      <circle cx="80" cy="105" r="22" fill="#facc15" opacity="0.85"/>
      <circle cx="60" cy="120" r="10" fill="#facc15" opacity="0.6"/>
    </g>
    <text x="430" y="160" font-size="22" fill="#94a3b8">→</text>
    <g transform="translate(460,70)">
      <rect width="120" height="160" rx="14" fill="#102a4d" stroke="#3b82f6"/>
      <text x="60" y="28" text-anchor="middle" font-weight="700" fill="#e0f2fe">Fused</text>
      <text x="60" y="48" text-anchor="middle" font-size="11">co-registered</text>
      <ellipse cx="60" cy="115" rx="42" ry="28" fill="none" stroke="#94a3b8" stroke-width="1.2"/>
      <circle cx="60" cy="115" r="18" fill="#facc15" opacity="0.85"/>
    </g>
    <text x="20" y="270" fill="#94a3b8">CT also provides attenuation correction for PET counts.</text>
    <text x="20" y="295" font-size="10" fill="#64748b">MedIntel Atlas — educational schematic. Not from a real patient.</text>
  </g>
</svg>
