<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" font-family="ui-sans-serif, system-ui, sans-serif" role="img" aria-label="CTDIvol times scan length equals DLP">
  <rect width="600" height="320" fill="#0b1220"/>
  <g fill="#cbd5e1" font-size="12">
    <text x="20" y="32" font-size="13" font-weight="700" fill="#e2e8f0">CT dose indices (educational reference)</text>
    <g transform="translate(40,70)">
      <rect width="140" height="90" rx="10" fill="#0f223e" stroke="#3b82f6"/>
      <text x="70" y="34" text-anchor="middle" font-weight="700" fill="#7dd3fc">CTDIvol</text>
      <text x="70" y="56" text-anchor="middle" font-size="11">scanner output</text>
      <text x="70" y="74" text-anchor="middle" font-size="11">per slice (mGy)</text>
    </g>
    <text x="200" y="125" font-size="22" fill="#94a3b8">×</text>
    <g transform="translate(230,70)">
      <rect width="140" height="90" rx="10" fill="#0f223e" stroke="#0ea5b7"/>
      <text x="70" y="34" text-anchor="middle" font-weight="700" fill="#7dd3fc">Scan length</text>
      <text x="70" y="56" text-anchor="middle" font-size="11">cm covered</text>
      <text x="70" y="74" text-anchor="middle" font-size="11">in z-axis</text>
    </g>
    <text x="390" y="125" font-size="22" fill="#94a3b8">=</text>
    <g transform="translate(420,70)">
      <rect width="160" height="90" rx="10" fill="#102a4d" stroke="#fbbf24"/>
      <text x="80" y="34" text-anchor="middle" font-weight="700" fill="#fde68a">DLP</text>
      <text x="80" y="56" text-anchor="middle" font-size="11">dose-length product</text>
      <text x="80" y="74" text-anchor="middle" font-size="11">(mGy·cm)</text>
    </g>
    <text x="20" y="220" fill="#94a3b8">CTDIvol and DLP are scanner output metrics, not patient dose.</text>
    <text x="20" y="240" fill="#94a3b8">Effective patient dose requires conversion factors and clinical context.</text>
    <text x="20" y="295" font-size="10" fill="#64748b">MedIntel Atlas — educational diagram. Always defer to your medical physicist for dose interpretation.</text>
  </g>
</svg>
